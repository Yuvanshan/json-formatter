<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JSON Viewer &amp; Formatter</title>
<script>
  // Apply saved/system theme before first paint to avoid a flash of the wrong theme.
  (function () {
    const saved = localStorage.getItem('jsonViewer.theme');
    const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  :root {
    color-scheme: light;
    --bg-page: #f7f7f8;
    --bg-surface: #ffffff;
    --bg-surface-alt: #fafafa;
    --border: #e2e2e4;
    --border-soft: #ececee;
    --text: #1e1e1e;
    --text-muted: #6b6b70;
    --text-faint: #9a9a9e;
    --btn-bg: #ffffff;
    --btn-border: #d6d6d9;
    --btn-hover-bg: #f0f0f2;
    --btn-hover-border: #c4c4c8;
    --primary-bg: #d97757;
    --primary-border: #d97757;
    --primary-hover-bg: #c4674b;
    --primary-hover-border: #c4674b;
    --primary-text: #ffffff;
    --status-ok: #1a7f37;
    --status-err: #b3261e;
    --active-bg: #eee7f5;
    --active-border: #d7c8ea;
    --node-key: #8b3a8b;
    --node-string: #1a7f37;
    --node-number: #1c5fbf;
    --node-boolean: #b3521e;
    --node-null: #9a9a9e;
    --node-punct: #6b6b70;
    --history-hover-bg: #f0eaf7;
    --history-hover-border: #e0d3ee;
    --scrollbar-thumb: #d6d6d9;
    --search-match-bg: #fff3b0;
    --search-current-bg: #ffcf40;
    --input-bg: #ffffff;
    --input-border: #d6d6d9;
    --shadow: 0 1px 2px rgba(20, 20, 22, 0.05);
    --diff-modified-bg: rgba(255, 165, 0, 0.20);
    --diff-modified-border: rgba(200, 120, 0, 0.45);
    --diff-missing-bg: rgba(255, 0, 0, 0.13);
    --diff-missing-border: rgba(211, 47, 47, 0.40);
    --diff-added-bg: rgba(0, 170, 0, 0.15);
    --diff-added-border: rgba(30, 140, 30, 0.45);
    --diff-gap-bg: var(--bg-surface-alt);
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #1b1c1f;
    --bg-surface: #232427;
    --bg-surface-alt: #202124;
    --border: #34353a;
    --border-soft: #2b2c30;
    --text: #e7e7ea;
    --text-muted: #a3a3a8;
    --text-faint: #78787e;
    --btn-bg: #2a2b2f;
    --btn-border: #3c3d42;
    --btn-hover-bg: #34353a;
    --btn-hover-border: #48494e;
    --primary-bg: #d97757;
    --primary-border: #d97757;
    --primary-hover-bg: #e5895f;
    --primary-hover-border: #e5895f;
    --primary-text: #1b1c1f;
    --status-ok: #4caf50;
    --status-err: #f14c4c;
    --active-bg: #3a2f47;
    --active-border: #5b4a70;
    --node-key: #c98ac9;
    --node-string: #6bc27a;
    --node-number: #6ea3ef;
    --node-boolean: #e2985f;
    --node-null: #8a8a90;
    --node-punct: #a3a3a8;
    --history-hover-bg: #322a3a;
    --history-hover-border: #48395a;
    --scrollbar-thumb: #45464b;
    --search-match-bg: #4a3f1a;
    --search-current-bg: #7a611f;
    --input-bg: #202124;
    --input-border: #3c3d42;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
    --diff-modified-bg: rgba(255, 175, 70, 0.22);
    --diff-modified-border: rgba(255, 175, 70, 0.55);
    --diff-missing-bg: rgba(255, 80, 80, 0.20);
    --diff-missing-border: rgba(255, 80, 80, 0.55);
    --diff-added-bg: rgba(70, 200, 110, 0.20);
    --diff-added-border: rgba(70, 200, 110, 0.55);
    --diff-gap-bg: var(--bg-surface-alt);
  }

  * { box-sizing: border-box; }

  /* Smooth color fade when toggling light/dark, instead of an instant snap. */
  body, header, .panel, .panel-header, .history-item, #output, textarea#input,
  #status, .search-row, .path-bar, #searchInput, #historyList {
    transition: background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-page);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 20px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    z-index: 1;
  }

  header h1 {
    font-size: 15.5px;
    margin: 0;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .toolbar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  button, .file-btn {
    font-family: inherit;
    font-size: 12.5px;
    padding: 7px 11px;
    border-radius: 6px;
    border: 1px solid var(--btn-border);
    background: var(--btn-bg);
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .05s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  button:hover, .file-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--btn-hover-border);
  }

  button:active { transform: scale(0.97); }

  button.primary {
    background: var(--primary-bg);
    border-color: var(--primary-border);
    color: var(--primary-text);
  }

  button.primary:hover {
    background: var(--primary-hover-bg);
    border-color: var(--primary-hover-border);
  }

  button.danger { color: var(--status-err); }

  button.btn-sm {
    font-size: 11.5px;
    padding: 4px 8px;
  }

  #themeToggle {
    font-size: 14px;
    padding: 7px 10px;
    line-height: 1;
  }

  input[type=file] { display: none; }

  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .editor-panel {
    flex: 1.2;
    border-right: 1px solid var(--border);
  }

  .result-panel {
    flex: 1.8;
    background: var(--bg-surface);
  }

  .history-panel {
    flex: 0 0 250px;
    border-left: 1px solid var(--border);
    background: var(--bg-surface-alt);
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 9px 14px;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-muted);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .input-count {
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
    color: var(--text-faint);
    font-size: 11px;
  }

  textarea#input {
    flex: 1;
    border: none;
    resize: none;
    padding: 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
    background: var(--bg-surface);
    color: var(--text);
  }

  #status {
    padding: 7px 14px;
    font-size: 12px;
    border-top: 1px solid var(--border-soft);
    color: var(--text-muted);
  }

  #status.ok { color: var(--status-ok); }
  #status.err { color: var(--status-err); }

  @keyframes statusPulse {
    0% { opacity: .25; }
    100% { opacity: 1; }
  }
  #status.status-pulse { animation: statusPulse .3s ease; }

  .status-undo {
    margin-left: 8px;
    padding: 2px 8px;
    font-size: 11px;
  }

  /* Drag-and-drop file import */
  .editor-panel {
    position: relative;
  }
  .editor-panel.drag-over {
    outline: 2px dashed var(--primary-bg);
    outline-offset: -2px;
  }
  .editor-panel.drag-over textarea#input {
    background: var(--active-bg);
  }
  .drop-hint {
    display: none;
    position: absolute;
    inset: 0;
    top: 37px;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-bg);
    background: var(--active-bg);
    opacity: .92;
    pointer-events: none;
    z-index: 2;
  }
  .editor-panel.drag-over .drop-hint {
    display: flex;
  }

  /* Search row */
  .search-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-surface-alt);
    flex-wrap: wrap;
  }

  #searchInput {
    flex: 1;
    min-width: 120px;
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }

  #searchInput:focus {
    border-color: var(--primary-bg);
  }

  .search-count {
    font-size: 11px;
    color: var(--text-faint);
    min-width: 44px;
    text-align: center;
  }

  .row-divider {
    width: 1px;
    align-self: stretch;
    background: var(--border);
    margin: 0 2px;
  }

  #output {
    flex: 1;
    overflow: auto;
    padding: 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.65;
  }

  #output.empty {
    color: var(--text-faint);
    font-family: inherit;
    font-size: 13px;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .output-animate { animation: fadeSlideIn .22s ease; }

  .view-toggle {
    display: flex;
    gap: 4px;
  }

  .view-toggle button.active {
    background: var(--active-bg);
    border-color: var(--active-border);
  }

  /* Tree view */
  .tree { white-space: pre; }
  .tree ul { list-style: none; margin: 0; padding-left: 18px; }
  .tree li { position: relative; }
  .node-key { color: var(--node-key); }
  .node-string { color: var(--node-string); }
  .node-number { color: var(--node-number); }
  .node-boolean { color: var(--node-boolean); }
  .node-null { color: var(--node-null); }
  .node-punct { color: var(--node-punct); }
  .toggle {
    cursor: pointer;
    display: inline-block;
    width: 14px;
    color: var(--node-punct);
    user-select: none;
  }
  .tree ul {
    overflow: hidden;
    transition: max-height .22s ease, opacity .18s ease;
  }
  .node-punct.path-trigger { cursor: pointer; }
  .node-punct.path-trigger:hover { text-decoration: underline; }

  li.leaf-row, li.node {
    border-radius: 3px;
    cursor: pointer;
    transition: background-color .3s ease;
  }

  .search-match { background: var(--search-match-bg); border-radius: 3px; }
  .search-match.search-current {
    background: var(--search-current-bg);
    animation: matchPulse .5s ease-out;
  }

  @keyframes matchPulse {
    0% { box-shadow: 0 0 0 0 rgba(217, 119, 87, .55); }
    100% { box-shadow: 0 0 0 6px rgba(217, 119, 87, 0); }
  }

  .flash { background: var(--active-bg); border-radius: 3px; }
  .copied-flash { background: var(--search-current-bg) !important; }

  /* Plain formatted text view */
  pre#plainOutput {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  /* Path bar */
  .path-bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 14px;
    border-top: 1px solid var(--border-soft);
    background: var(--bg-surface-alt);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    color: var(--text-muted);
  }

  .path-bar.show { display: flex; }

  #pathText {
    overflow: auto;
    white-space: nowrap;
    flex: 1;
  }

  /* History list */
  #historyList {
    flex: 1;
    overflow: auto;
    padding: 6px;
  }

  .history-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 4px;
    border: 1px solid transparent;
  }

  .history-item:hover {
    background: var(--history-hover-bg);
    border-color: var(--history-hover-border);
  }

  .history-item .h-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .history-item .h-title {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .history-item .h-delete {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0;
    line-height: 1;
    flex-shrink: 0;
  }

  .history-item .h-delete:hover { color: var(--status-err); }

  .history-item .h-meta {
    font-size: 11px;
    color: var(--text-faint);
    display: flex;
    justify-content: space-between;
    gap: 6px;
  }

  .history-item .h-type {
    font-weight: 600;
  }

  .history-item .h-preview {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .history-empty {
    padding: 20px 14px;
    font-size: 12.5px;
    color: var(--text-faint);
  }

  .h-clear {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0;
  }
  .h-clear:hover { color: var(--status-err); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ===== Compare feature ===== */
  .view { flex: 1; display: flex; min-height: 0; }
  .view[hidden] { display: none !important; }
  .compare-view { flex-direction: column; }

  .compare-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .compare-tabs { display: flex; gap: 4px; }

  .compare-tabs button.tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    padding: 11px 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .compare-tabs button.tab:hover { background: none; color: var(--text); }
  .compare-tabs button.tab.active { color: var(--primary-bg); border-bottom-color: var(--primary-bg); }

  .compare-tab-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .compare-tab-panel[hidden] { display: none; }

  .compare-warning {
    padding: 8px 16px;
    font-size: 12px;
    background: #fff3cd;
    color: #7a5b00;
    border-bottom: 1px solid #f0dca0;
  }
  :root[data-theme="dark"] .compare-warning { background: #4a3f1a; color: #f0d888; border-color: #6b5a1f; }
  .compare-warning[hidden] { display: none; }

  .compare-input-grid {
    flex: 1;
    display: flex;
    min-height: 0;
    gap: 1px;
    background: var(--border);
    overflow: auto;
  }

  .compare-side {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-surface);
  }

  .compare-side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border-soft);
    flex-wrap: wrap;
  }

  .compare-side-header .cs-title { font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .compare-side-header .cs-actions { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .compare-side-header .cs-count { font-size: 11px; color: var(--text-faint); }

  .compare-side textarea {
    flex: 1;
    border: none;
    resize: none;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.5;
    outline: none;
    background: var(--bg-surface);
    color: var(--text);
    min-height: 160px;
  }

  .compare-side.drag-over textarea { background: var(--active-bg); }
  .compare-side.drag-over { outline: 2px dashed var(--primary-bg); outline-offset: -2px; }

  .compare-side-status {
    padding: 6px 14px;
    font-size: 11.5px;
    border-top: 1px solid var(--border-soft);
    color: var(--text-muted);
    white-space: pre-wrap;
    max-height: 90px;
    overflow: auto;
  }
  .compare-side-status.ok { color: var(--status-ok); }
  .compare-side-status.err { color: var(--status-err); }

  .compare-options {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface-alt);
    font-size: 12px;
    flex-wrap: wrap;
  }
  .compare-options label { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); cursor: pointer; }
  .compare-options input[type="text"], .compare-options input[type="number"] {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 7px;
    border-radius: 5px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    width: 150px;
  }
  .compare-options input[type="number"] { width: 64px; }

  .compare-actions {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-surface);
    flex-wrap: wrap;
  }

  .compare-summary {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    flex-wrap: wrap;
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border);
  }

  .summary-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 12px;
    border-radius: 8px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    min-width: 72px;
  }
  .summary-pill .sp-value { font-size: 15px; font-weight: 700; }
  .summary-pill .sp-label { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; text-align: center; }
  .summary-pill.sp-modified .sp-value { color: #b3691a; }
  .summary-pill.sp-missing .sp-value { color: var(--status-err); }
  .summary-pill.sp-added .sp-value { color: var(--status-ok); }
  .summary-pill.sp-status-diff { border-color: var(--status-err); }
  .summary-pill.sp-status-same { border-color: var(--status-ok); }

  .compare-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border-soft);
    background: var(--bg-surface-alt);
    flex-wrap: wrap;
  }
  .compare-toolbar select {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
  }
  #compareSearchInput {
    flex: 1;
    min-width: 110px;
    max-width: 220px;
    font-family: inherit;
    font-size: 12.5px;
    padding: 6px 9px;
    border-radius: 6px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  #compareSearchInput:focus { border-color: var(--primary-bg); }

  .compare-panes {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .compare-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    border-right: 1px solid var(--border);
  }
  .compare-pane:last-child { border-right: none; }

  .compare-pane-header {
    padding: 7px 14px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--bg-surface-alt);
    border-bottom: 1px solid var(--border-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .compare-pane-body {
    flex: 1;
    overflow: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    background: var(--bg-surface);
  }

  .diff-line { display: flex; min-height: 1.6em; white-space: pre; }
  .diff-line.diff-hidden { display: none; }

  .diff-ln {
    flex: 0 0 42px;
    text-align: right;
    padding-right: 8px;
    color: var(--text-faint);
    user-select: none;
    background: var(--bg-surface-alt);
    border-right: 1px solid var(--border-soft);
    position: sticky;
    left: 0;
  }

  .diff-content { flex: 1; padding: 0 10px; }
  .diff-content .diff-toggle { cursor: pointer; color: var(--node-punct); user-select: none; margin-right: 2px; display: inline-block; width: 12px; }
  .diff-content .diff-key { color: var(--node-key); }
  .diff-content .diff-str { color: var(--node-string); }
  .diff-content .diff-num { color: var(--node-number); }
  .diff-content .diff-bool { color: var(--node-boolean); }
  .diff-content .diff-null { color: var(--node-null); }
  .diff-content .diff-punct { color: var(--node-punct); }
  .diff-content .diff-empty-gap { color: var(--text-faint); font-style: italic; }
  .diff-content .diff-typenote { color: var(--text-faint); font-style: italic; margin-left: 6px; }

  .diff-content.diff-added { background: var(--diff-added-bg); box-shadow: inset 2px 0 0 0 var(--diff-added-border); }
  .diff-content.diff-removed { background: var(--diff-missing-bg); box-shadow: inset 2px 0 0 0 var(--diff-missing-border); }
  .diff-content.diff-modified { background: var(--diff-modified-bg); box-shadow: inset 2px 0 0 0 var(--diff-modified-border); }
  .diff-content.diff-gapside { background: var(--diff-gap-bg); }

  .diff-content.search-match { outline: 2px solid var(--search-match-bg); outline-offset: -1px; }
  .diff-line.diff-current-match .diff-content { box-shadow: inset 0 0 0 2px var(--search-current-bg); }

  .compare-loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    font-size: 13px;
    color: var(--text-muted);
    gap: 8px;
  }
  .compare-loading[hidden] { display: none; }

  .compare-empty-result {
    padding: 30px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13px;
  }

  @media (max-width: 860px) {
    .compare-input-grid, .compare-panes { flex-direction: column; }
    .compare-pane { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <h1>🧾 JSON Viewer &amp; Formatter</h1>
  <div class="toolbar">
    <label class="file-btn" for="fileInput">📂 Open file…</label>
