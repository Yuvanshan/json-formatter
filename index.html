<script>
(function () {
  const STORAGE_KEY = 'jsonViewer.history.v1';
  const MAX_HISTORY = 30;

  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const status = document.getElementById('status');
  const historyList = document.getElementById('historyList');
  const searchRow = document.getElementById('searchRow');
  const searchInput = document.getElementById('searchInput');
  const searchCount = document.getElementById('searchCount');
  const pathBar = document.getElementById('pathBar');
  const pathText = document.getElementById('pathText');
  const inputCount = document.getElementById('inputCount');

  let lastFormatted = '';
  let lastParsed = undefined;
  let currentView = 'tree';
  let searchableNodes = [];
  let currentMatches = [];
  let currentMatchIndex = -1;

  // ---------- History (localStorage) ----------
  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function methodTypeLabel(method) {
    switch (method) {
      case 'valid': return 'JSON';
      case 'repaired': case 'structdump': case 'jsonl': return 'JSON-like';
      case 'keyvalue': return 'Key-Value';
      default: return 'Text';
    }
  }

  // Records a successful, user-initiated conversion. Stores the full
  // formatted output (not just a preview) so opening this entry later can
  // restore the exact result without re-running the parser (FR-05).
  function addToHistory(name, rawText, formattedText, type) {
    const list = loadHistory();
    const entry = {
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      name: name || 'Pasted JSON',
      time: new Date().toISOString(),
      type: type || 'JSON',
      preview: formattedText.replace(/\s+/g, ' ').slice(0, 120),
      content: rawText,
      formatted: formattedText
    };
    list.unshift(entry);
    while (list.length > MAX_HISTORY) list.pop();
    saveHistory(list);
    renderHistory();
  }

  function deleteHistoryEntry(id) {
    saveHistory(loadHistory().filter((e) => e.id !== id));
    renderHistory();
  }

  // Loads a history entry as a read-only view: restores the original input
  // and the exact previously-saved output, without re-parsing and without
  // creating a new history entry (FR-05/FR-06).
  function loadHistoryEntry(entry) {
    hidePathBar();
    input.value = entry.content;
    updateInputCount();
    lastFormatted = entry.formatted;
    try {
      lastParsed = JSON.parse(entry.formatted);
    } catch (e) {
      lastParsed = entry.formatted;
    }
    output.className = '';
    renderOutput();
    const stats = computeStats(lastParsed);
    setStatus('Loaded from history (' + entry.type + ') · ' + stats.keys + ' keys · depth ' + stats.depth, true);
  }

  function renderHistory() {
    const list = loadHistory();
    historyList.innerHTML = '';
    if (!list.length) {
      historyList.innerHTML = '<div class="history-empty">No history yet. Formatted JSON will show up here.</div>';
      return;
    }
    list.forEach((entry) => {
      const div = document.createElement('div');
      div.className = 'history-item';
      const time = new Date(entry.time);
      const timeStr = time.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' +
        time.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      div.innerHTML =
        '<div class="h-row"><div class="h-title"></div><button class="h-delete" title="Delete this entry">✕</button></div>' +
        '<div class="h-meta"><span class="h-type"></span><span class="h-time"></span></div>' +
        '<div class="h-preview"></div>';
      div.querySelector('.h-title').textContent = entry.name;
      div.querySelector('.h-type').textContent = entry.type || 'JSON';
      div.querySelector('.h-time').textContent = timeStr;
      div.querySelector('.h-preview').textContent = entry.preview;
      div.querySelector('.h-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteHistoryEntry(entry.id);
      });
      div.addEventListener('click', () => loadHistoryEntry(entry));
      historyList.appendChild(div);
    });
  }

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (confirm('Clear all history?')) {
      saveHistory([]);
      renderHistory();
    }
  });

  // ---------- File open ----------
  function loadFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      input.value = reader.result;
      updateInputCount();
      // Importing a file only loads it into the editor; it does not count
      // as a user-initiated conversion, so it must not save history (FR-07).
      formatJSON(file.name, false);
    };
    reader.readAsText(file);
  }

  document.getElementById('fileInput').addEventListener('change', (e) => {
    loadFile(e.target.files[0]);
    e.target.value = '';
  });

  // ---------- Drag-and-drop file import ----------
  const editorPanel = document.querySelector('.editor-panel');
  let dragDepth = 0;

  editorPanel.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    editorPanel.classList.add('drag-over');
  });
  editorPanel.addEventListener('dragover', (e) => e.preventDefault());
  editorPanel.addEventListener('dragleave', (e) => {
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) editorPanel.classList.remove('drag-over');
  });
  editorPanel.addEventListener('drop', (e) => {
    e.preventDefault();
    dragDepth = 0;
    editorPanel.classList.remove('drag-over');
    loadFile(e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  // ---------- Format / Minify ----------
  function setStatus(msg, ok) {
    status.textContent = (ok ? '✓ ' : '✕ ') + msg;
    status.className = ok ? 'ok' : 'err';
    // Restart the pulse animation even if the class is already present.
    status.classList.remove('status-pulse');
    void status.offsetWidth;
    status.classList.add('status-pulse');
  }

  function computeStats(value) {
    let keys = 0;
    let maxDepth = 0;
    (function walk(v, depth) {
      maxDepth = Math.max(maxDepth, depth);
      if (Array.isArray(v)) {
        v.forEach((item) => walk(item, depth + 1));
      } else if (v !== null && typeof v === 'object') {
        const ks = Object.keys(v);
        keys += ks.length;
        ks.forEach((k) => walk(v[k], depth + 1));
      }
    })(value, 0);
    return { keys, depth: maxDepth };
  }

  function updateInputCount() {
    const text = input.value;
    if (!text) {
      inputCount.textContent = '';
      return;
    }
    const lines = text.split(/\r?\n/).length;
    inputCount.textContent = text.length.toLocaleString() + ' chars · ' + lines.toLocaleString() + ' lines';
  }
  input.addEventListener('input', updateInputCount);

  function hidePathBar() {
    pathBar.classList.remove('show');
    pathText.textContent = '';
  }

  // Shared tokenizer for "struct dump" text: nested { key: value, ... } /
  // [ ... ] where keys and string values are NOT quoted (typical of Go
  // %+v-style struct prints or backend debug logs). Scalar values that
  // themselves contain commas (e.g. "29 Castle Ln, Colombo, Sri Lanka") are
  // handled by only treating a comma as a field separator when it's
  // followed by what looks like the next "identifier:" key. Used both by
  // the strict single-value parser and the lenient multi-chunk recovery
  // parser below, sharing one mutable cursor over the string.
  function createDumpTokenizer(s) {
    let i = 0;
    let failed = false;

    function skipWs() { while (i < s.length && /\s/.test(s[i])) i++; }
    function isKeyStart(ch) { return /[A-Za-z_$]/.test(ch); }

    function looksLikeKeyAhead(pos) {
      let j = pos;
      while (j < s.length && /\s/.test(s[j])) j++;
      if (j >= s.length || !isKeyStart(s[j])) return false;
      while (j < s.length && /[A-Za-z0-9_$]/.test(s[j])) j++;
      while (j < s.length && /\s/.test(s[j])) j++;
      return s[j] === ':';
    }

    function coerceScalar(text) {
      const t = text.trim();
      if (t === '') return '';
      if (/^(true|false)$/i.test(t)) return t.toLowerCase() === 'true';
      if (/^null$/i.test(t)) return null;
      if (/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t)) return Number(t);
      return t;
    }

    function parseValue(inArray) {
      skipWs();
      if (i >= s.length) return '';
      if (s[i] === '{') return parseObject();
      if (s[i] === '[') return parseArray();
      return parseScalar(inArray);
    }

    function parseScalar(inArray) {
      const start = i;
      while (i < s.length) {
        const ch = s[i];
        if (ch === '}' || ch === ']') break;
        if (ch === ',') {
          if (inArray || looksLikeKeyAhead(i + 1)) break;
          i++;
          continue;
        }
        i++;
      }
      return coerceScalar(s.slice(start, i));
    }

    function parseObject() {
      i++; // consume {
      const obj = {};
      skipWs();
      if (s[i] === '}') { i++; return obj; }
      while (i < s.length) {
        skipWs();
        const keyStart = i;
        while (i < s.length && s[i] !== ':' && s[i] !== ',' && s[i] !== '}') i++;
        const key = s.slice(keyStart, i).trim();
        if (s[i] !== ':' || !key) { failed = true; return obj; }
        i++; // consume ':'
        obj[key] = parseValue(false);
        skipWs();
        if (s[i] === ',') { i++; continue; }
        if (s[i] === '}') { i++; break; }
        failed = true;
        break;
      }
      return obj;
    }

    function parseArray() {
      i++; // consume [
      const arr = [];
      skipWs();
      if (s[i] === ']') { i++; return arr; }
      while (i < s.length) {
        arr.push(parseValue(true));
        skipWs();
        if (s[i] === ',') { i++; continue; }
        if (s[i] === ']') { i++; break; }
        failed = true;
        break;
      }
      return arr;
    }

    return {
      parseValue: parseValue,
      looksLikeKeyAhead: looksLikeKeyAhead,
      skipWs: skipWs,
      pos: function () { return i; },
      setPos: function (p) { i = p; },
      atEnd: function () { return i >= s.length; },
      hasFailed: function () { return failed; },
      clearFailed: function () { failed = false; }
    };
  }

  // Strict single-value parse: the whole (trimmed) input must be exactly
  // one well-formed object/array in this format. Returns { ok:false, index }
  // pointing at the offset where parsing stalled if it doesn't fully
  // consume the input, so callers can fall back to something more lenient.
  function parseStructDump(raw) {
    const leadingWs = (raw.match(/^\s*/) || [''])[0].length;
    const s = raw.trim();
    if (!s || (s[0] !== '{' && s[0] !== '[')) return { ok: false, index: leadingWs };
    const tok = createDumpTokenizer(s);
    const value = tok.parseValue(false);
    tok.skipWs();
    if (tok.hasFailed() || !tok.atEnd()) return { ok: false, index: leadingWs + tok.pos() };
    return { ok: true, value: value };
  }

  function tryParseStructDump(raw) {
    const r = parseStructDump(raw);
    return r.ok ? r.value : null;
  }

  // Best-effort recovery for input that doesn't fully parse as one clean
  // struct dump — e.g. a paste that starts mid-structure (missing its own
  // key name), is missing an outer wrapper, or has a stray unmatched
  // bracket somewhere. Rather than giving up, this walks the text as a
  // sequence of top-level pieces (each either "key: value" or a bare value
  // with no key) and merges everything into one object: named pieces become
  // fields, unnamed object pieces get spread into the result, and anything
  // else gets a synthetic key. A stuck cursor (a character that isn't part
  // of any recognizable piece) is skipped one character at a time so this
  // always terminates and always returns *something*, never an error.
  function parseLenientRoot(raw) {
    const s = raw.trim();
    if (!s) return {};
    const tok = createDumpTokenizer(s);
    const chunks = [];
    let guard = 0;
    const maxIterations = 20000;

    while (!tok.atEnd() && guard++ < maxIterations) {
      tok.skipWs();
      if (tok.atEnd()) break;

      let key = null;
      if (tok.looksLikeKeyAhead(tok.pos())) {
        let p = tok.pos();
        const keyStart = p;
        while (p < s.length && /[A-Za-z0-9_$]/.test(s[p])) p++;
        key = s.slice(keyStart, p);
        while (p < s.length && /\s/.test(s[p])) p++;
        p++; // consume ':'
        tok.setPos(p);
      }

      const posBefore = tok.pos();
      const value = tok.parseValue(false);
      tok.clearFailed();

      if (tok.pos() === posBefore && key === null) {
        // Stuck on a character that starts neither a key nor a value
        // (e.g. a stray bracket) — skip past it and keep going.
        tok.setPos(posBefore + 1);
        continue;
      }

      chunks.push({ key: key, value: value });
      tok.skipWs();
      if (s[tok.pos()] === ',') { tok.setPos(tok.pos() + 1); continue; }
      // No comma — if a new key clearly starts right here, keep going
      // (handles newline-separated pairs with no commas at all).
      if (tok.looksLikeKeyAhead(tok.pos())) continue;
    }

    if (!tok.atEnd()) {
      const rest = s.slice(tok.pos()).trim();
      if (rest) chunks.push({ key: null, value: rest });
    }

    if (chunks.length === 1 && chunks[0].key === null) {
      return chunks[0].value;
    }

    const result = {};
    let anonCount = 0;
    chunks.forEach((c) => {
      if (c.key) {
        result[c.key] = c.value;
      } else if (c.value !== null && typeof c.value === 'object' && !Array.isArray(c.value)) {
        Object.assign(result, c.value);
      } else {
        anonCount++;
        result['value' + (anonCount > 1 ? anonCount : '')] = c.value;
      }
    });
    return result;
  }

  function repairJsSyntax(text) {
    text = text.replace(/\/\*[\s\S]*?\*\//g, '');
    text = text.replace(/(^|[^:])\/\/.*$/gm, '$1');
    text = text.replace(/,(\s*[}\]])/g, '$1');
    text = text.replace(/'((?:\\.|[^'\\])*)'/g, (m, p1) =>
      '"' + p1.replace(/\\'/g, "'").replace(/"/g, '\\"') + '"');
    text = text.replace(/([{,]\s*)([A-Za-z_$][A-Za-z0-9_$]*)\s*:/g, '$1"$2":');
    return text;
  }

  // Attempts, in order: strict JSON, lenient JS-object-style repair (quotes/
  // commas/comments), unquoted "struct dump" (nested, for input that's
  // already one clean object/array). If the input looks like it's meant to
  // be an object/array but isn't a single clean one (missing outer wrapper,
  // pasted starting mid-structure, stray unmatched bracket, etc.), falls
  // back to the lenient multi-chunk recovery parser rather than failing —
  // this app never shows a parse error, it always produces something.
  // Otherwise — free-form text with no braces — tries wrapping bare
  // "key: value" pairs into an object, then JSONL, then loose per-line
  // key/value text, and finally wraps whatever is left as a plain JSON
  // object. Always returns a { value, method } pair — never throws.
  function attemptJSONify(raw) {
    const trimmed = raw.trim();
    const looksBraced = trimmed.length > 0 && (trimmed[0] === '{' || trimmed[0] === '[');

    try {
      return { value: JSON.parse(raw), method: 'valid' };
    } catch (e) { /* fall through */ }

    try {
      return { value: JSON.parse(repairJsSyntax(raw)), method: 'repaired' };
    } catch (e) { /* fall through */ }

    const structDump = parseStructDump(raw);
    if (structDump.ok) {
      return { value: structDump.value, method: 'structdump' };
    }

    if (looksBraced) {
      return { value: parseLenientRoot(raw), method: 'lenient' };
    }

    const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (lines.length > 1) {
      try {
        const values = lines.map((l) => JSON.parse(l));
        return { value: values, method: 'jsonl' };
      } catch (e) { /* fall through */ }
    }

    // Bare "key: value, key2: value2" pairs on a single line with no outer
    // braces — wrap into an object and retry both repair strategies. Only
    // for single-line input: multi-line bare pairs are newline-separated
    // (no commas between fields), which the per-line splitter below already
    // handles correctly.
    if (lines.length === 1 && raw.indexOf(':') !== -1) {
      const wrapped = '{' + raw + '}';
      try {
        return { value: JSON.parse(repairJsSyntax(wrapped)), method: 'keyvalue' };
      } catch (e) { /* fall through */ }

      const wrappedDump = parseStructDump(wrapped);
      const looksLikeRealKeys = wrappedDump.ok && Object.keys(wrappedDump.value).every(
        (k) => /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k)
      );
      if (looksLikeRealKeys) {
        return { value: wrappedDump.value, method: 'keyvalue' };
      }
    }

    if (lines.length > 0) {
      const kvRegex = /^["']?([^"':=]+?)["']?\s*[:=]\s*(.*)$/;
      const obj = {};
      let matched = 0;
      lines.forEach((line) => {
        const m = line.match(kvRegex);
        if (!m) return;
        matched++;
        const key = m[1].trim();
        const valRaw = m[2].trim().replace(/,$/, '');
        let val;
        try {
          val = JSON.parse(valRaw);
        } catch (e) {
          if (/^(true|false)$/i.test(valRaw)) val = valRaw.toLowerCase() === 'true';
          else if (valRaw !== '' && !isNaN(Number(valRaw))) val = Number(valRaw);
          else val = valRaw.replace(/^["']|["']$/g, '');
        }
        obj[key] = val;
      });
      if (matched === lines.length) {
        return { value: obj, method: 'keyvalue' };
      }
    }

    if (lines.length > 1) {
      return { value: { lines: lines }, method: 'text' };
    }
    return { value: { text: trimmed }, method: 'text' };
  }

  function methodStatus(method) {
    switch (method) {
      case 'valid': return 'Valid JSON';
      case 'repaired': return 'Auto-fixed JSON (quotes/commas/comments)';
      case 'jsonl': return 'Converted line-delimited JSON to an array';
      case 'structdump': return 'Converted unquoted struct dump to JSON';
      case 'lenient': return 'Recovered JSON from an irregular/partial structure (best effort)';
      case 'keyvalue': return 'Converted key/value text to JSON';
      default: return 'Not JSON — wrapped plain text into a JSON object';
    }
  }

  function formatJSON(sourceName, save) {
    if (save === undefined) save = true;
    const raw = input.value;
    hidePathBar();
    if (!raw.trim()) {
      setStatus('Nothing to format — paste or open some text first.', false);
      output.className = 'empty';
      output.textContent = 'Formatted or opened JSON will appear here.';
      lastFormatted = '';
      lastParsed = undefined;
      return;
    }
    const { value: parsed, method } = attemptJSONify(raw);
    lastParsed = parsed;
    lastFormatted = JSON.stringify(parsed, null, 2);
    output.className = '';
    renderOutput();
    const size = new Blob([raw]).size;
    const stats = computeStats(parsed);
    setStatus(methodStatus(method) + ' · ' + size.toLocaleString() + ' bytes · ' + stats.keys + ' keys · depth ' + stats.depth, true);
    if (save) {
      addToHistory(sourceName, raw, lastFormatted, methodTypeLabel(method));
    }
  }

  function minifyJSON() {
    const raw = input.value;
    hidePathBar();
    if (!raw.trim()) {
      setStatus('Nothing to minify — paste or open some text first.', false);
      return;
    }
    const { value: parsed, method } = attemptJSONify(raw);
    lastParsed = parsed;
    const minified = JSON.stringify(parsed);
    lastFormatted = JSON.stringify(parsed, null, 2);
    input.value = minified;
    updateInputCount();
    output.className = '';
    renderOutput();
    const stats = computeStats(parsed);
    setStatus(methodStatus(method) + ' · Minified · ' + new Blob([minified]).size.toLocaleString() + ' bytes · ' + stats.keys + ' keys · depth ' + stats.depth, true);
    addToHistory(null, raw, lastFormatted, methodTypeLabel(method));
  }

  // ---------- Rendering: tree + plain ----------
  function renderOutput() {
    if (lastParsed === undefined) return;
    if (currentView === 'tree') {
      searchRow.style.display = 'flex';
      output.innerHTML = '<div class="tree output-animate"></div>';
      output.querySelector('.tree').appendChild(buildTree(lastParsed));
      if (searchInput.value.trim()) performSearch(searchInput.value);
    } else {
      searchRow.style.display = 'none';
      output.innerHTML = '<pre id="plainOutput" class="output-animate"></pre>';
      document.getElementById('plainOutput').textContent = lastFormatted;
    }
  }

  function isValidIdentifier(k) {
    return /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(String(k));
  }

  function showPath(path, el) {
    pathBar.classList.add('show');
    pathText.textContent = path;
    if (el) {
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 500);
    }
  }

  // Single place that (un)collapses a tree node, animated or not. Used by
  // the per-node toggle click, search's auto-expand-to-match, and the
  // Expand/Collapse all buttons, so every code path stays in sync — the
  // `collapsed` class alone no longer hides anything; the actual hiding is
  // this function driving max-height/opacity directly.
  function setNodeCollapsed(li, collapsed, animate) {
    const ul = li.querySelector(':scope > ul');
    const toggle = li.querySelector(':scope > .toggle');
    if (!ul) return;
    if (collapsed) {
      li.classList.add('collapsed');
      if (toggle) toggle.textContent = '▸';
      if (animate) {
        ul.style.maxHeight = ul.scrollHeight + 'px';
        ul.style.opacity = '1';
        requestAnimationFrame(() => {
          ul.style.maxHeight = '0px';
          ul.style.opacity = '0';
        });
      } else {
        ul.style.maxHeight = '0px';
        ul.style.opacity = '0';
      }
    } else {
      li.classList.remove('collapsed');
      if (toggle) toggle.textContent = '▾';
      if (animate) {
        ul.style.maxHeight = ul.scrollHeight + 'px';
        ul.style.opacity = '1';
        ul.addEventListener('transitionend', function onDone(ev) {
          if (ev.propertyName !== 'max-height') return;
          ul.style.maxHeight = '';
          ul.removeEventListener('transitionend', onDone);
        });
      } else {
        ul.style.maxHeight = '';
        ul.style.opacity = '1';
      }
    }
  }

  function expandAncestors(el) {
    let p = el.parentElement;
    while (p) {
      if (p.classList && p.classList.contains('collapsed')) {
        setNodeCollapsed(p, false, true);
      }
      p = p.parentElement;
    }
  }

  function buildTree(value) {
    searchableNodes = [];
    const wrapper = document.createElement('span');

    function renderValue(v, path) {
      if (v === null) {
        const s = document.createElement('span');
        s.className = 'node-null';
        s.textContent = 'null';
        return s;
      }
      const t = typeof v;
      if (t === 'string') {
        const s = document.createElement('span');
        s.className = 'node-string';
        s.textContent = JSON.stringify(v);
        return s;
      }
      if (t === 'number') {
        const s = document.createElement('span');
        s.className = 'node-number';
        s.textContent = String(v);
        return s;
      }
      if (t === 'boolean') {
        const s = document.createElement('span');
        s.className = 'node-boolean';
        s.textContent = String(v);
        return s;
      }
      if (Array.isArray(v)) return renderContainer(v, '[', ']', true, path);
      if (t === 'object') return renderContainer(v, '{', '}', false, path);
      const s = document.createElement('span');
      s.textContent = String(v);
      return s;
    }

    function renderContainer(obj, open, close, isArray, path) {
      const keys = isArray ? obj.map((_, i) => i) : Object.keys(obj);
      const container = document.createElement('span');

      if (keys.length === 0) {
        const punct = document.createElement('span');
        punct.className = 'node-punct';
        punct.textContent = open + close;
        container.appendChild(punct);
        return container;
      }

      const li = document.createElement('li');
      li.className = 'node';

      const toggle = document.createElement('span');
      toggle.className = 'toggle';
      toggle.textContent = '▾';
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        setNodeCollapsed(li, !li.classList.contains('collapsed'), true);
      });

      const openPunct = document.createElement('span');
      openPunct.className = 'node-punct path-trigger';
      openPunct.textContent = open;
      openPunct.title = 'Click to show path';
      openPunct.addEventListener('click', (e) => {
        e.stopPropagation();
        showPath(path, li);
      });

      const closePunct = document.createElement('span');
      closePunct.className = 'node-punct';
      closePunct.textContent = close;

      const ul = document.createElement('ul');
      keys.forEach((k, idx) => {
        const childLi = document.createElement('li');
        childLi.className = 'leaf-row';
        const childPath = path + (isArray ? ('[' + idx + ']') : ('.' + (isValidIdentifier(k) ? k : JSON.stringify(k))));
        childLi.dataset.path = childPath;

        let keyLabel = '';
        if (!isArray) {
          const keySpan = document.createElement('span');
          keySpan.className = 'node-key';
          keyLabel = JSON.stringify(k);
          keySpan.textContent = keyLabel;
          childLi.appendChild(keySpan);
          const colon = document.createElement('span');
          colon.className = 'node-punct';
          colon.textContent = ': ';
          childLi.appendChild(colon);
        }

        const val = obj[k];
        const isScalar = val === null || ['string', 'number', 'boolean'].includes(typeof val);
        childLi.appendChild(renderValue(val, childPath));

        if (idx < keys.length - 1) {
          const comma = document.createElement('span');
          comma.className = 'node-punct';
          comma.textContent = ',';
          childLi.appendChild(comma);
        }

        childLi.title = 'Click to show path · Double-click to copy this value';
        childLi.addEventListener('click', (e) => {
          e.stopPropagation();
          showPath(childPath, childLi);
        });
        childLi.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          const text = typeof val === 'string' ? val : JSON.stringify(val, null, 2);
          copyValueToClipboard(text, childLi);
        });

        const valueText = isScalar ? (val === null ? 'null' : (typeof val === 'string' ? val : String(val))) : '';
        searchableNodes.push({ el: childLi, text: (keyLabel + ' ' + valueText).toLowerCase(), path: childPath });

        ul.appendChild(childLi);
      });

      li.appendChild(toggle);
      li.appendChild(openPunct);
      li.appendChild(ul);
      li.appendChild(closePunct);
      container.appendChild(li);
      return container;
    }

    const root = document.createElement('ul');
    root.style.paddingLeft = '0';
    const rootLi = document.createElement('li');
    rootLi.style.listStyle = 'none';
    rootLi.appendChild(renderValue(value, '$'));
    root.appendChild(rootLi);
    wrapper.appendChild(root);
    return wrapper;
  }

  // ---------- Search ----------
  function clearSearchHighlights() {
    document.querySelectorAll('.search-match').forEach((el) => el.classList.remove('search-match', 'search-current'));
  }

  function updateSearchCount() {
    if (!currentMatches.length) {
      searchCount.textContent = searchInput.value.trim() ? '0 / 0' : '';
    } else {
      searchCount.textContent = (currentMatchIndex + 1) + ' / ' + currentMatches.length;
    }
  }

  function focusMatch() {
    currentMatches.forEach((n) => n.el.classList.remove('search-current'));
    const m = currentMatches[currentMatchIndex];
    if (!m) return;
    m.el.classList.add('search-current');
    m.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function performSearch(rawQuery) {
    clearSearchHighlights();
    const query = rawQuery.trim().toLowerCase();
    currentMatches = [];
    currentMatchIndex = -1;
    if (!query) {
      updateSearchCount();
      return;
    }
    searchableNodes.forEach((n) => {
      if (n.text.includes(query)) currentMatches.push(n);
    });
    currentMatches.forEach((n) => {
      expandAncestors(n.el);
      n.el.classList.add('search-match');
    });
    if (currentMatches.length) {
      currentMatchIndex = 0;
      focusMatch();
    }
    updateSearchCount();
  }

  function goToMatch(delta) {
    if (!currentMatches.length) return;
    currentMatchIndex = (currentMatchIndex + delta + currentMatches.length) % currentMatches.length;
    focusMatch();
    updateSearchCount();
  }

  searchInput.addEventListener('input', () => performSearch(searchInput.value));
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      goToMatch(e.shiftKey ? -1 : 1);
    }
  });
  document.getElementById('prevMatchBtn').addEventListener('click', () => goToMatch(-1));
  document.getElementById('nextMatchBtn').addEventListener('click', () => goToMatch(1));

  // ---------- Expand / Collapse all ----------
  function setAllCollapsed(collapsed) {
    // Bulk operation — skip the per-node animation so expanding/collapsing
    // a large tree doesn't fire dozens of simultaneous transitions at once.
    output.querySelectorAll('.node').forEach((li) => {
      setNodeCollapsed(li, collapsed, false);
    });
  }
  document.getElementById('expandAllBtn').addEventListener('click', () => setAllCollapsed(false));
  document.getElementById('collapseAllBtn').addEventListener('click', () => setAllCollapsed(true));

  // ---------- Path bar ----------
  document.getElementById('copyPathBtn').addEventListener('click', async () => {
    if (!pathText.textContent) return;
    try {
      await navigator.clipboard.writeText(pathText.textContent);
      setStatus('Copied path: ' + pathText.textContent, true);
    } catch (e) {
      setStatus('Could not copy path automatically.', false);
    }
  });

  // ---------- View toggle ----------
  document.getElementById('treeViewBtn').addEventListener('click', () => {
    currentView = 'tree';
    document.getElementById('treeViewBtn').classList.add('active');
    document.getElementById('plainViewBtn').classList.remove('active');
    renderOutput();
  });

  document.getElementById('plainViewBtn').addEventListener('click', () => {
    currentView = 'plain';
    document.getElementById('plainViewBtn').classList.add('active');
    document.getElementById('treeViewBtn').classList.remove('active');
    hidePathBar();
    renderOutput();
  });

  // ---------- Buttons ----------
  document.getElementById('formatBtn').addEventListener('click', () => formatJSON());
  document.getElementById('minifyBtn').addEventListener('click', minifyJSON);

  // Briefly swaps a button's label to a checkmark to confirm an action landed.
  function flashButton(button, label) {
    if (!button) return;
    const original = button.innerHTML;
    button.textContent = label;
    button.disabled = true;
    setTimeout(() => {
      button.innerHTML = original;
      button.disabled = false;
    }, 1200);
  }

  async function copyFormattedJSON(button) {
    if (!lastFormatted) {
      setStatus('Nothing to copy yet — format some JSON first.', false);
      return;
    }
    try {
      await navigator.clipboard.writeText(lastFormatted);
      setStatus('Copied formatted JSON to clipboard.', true);
      flashButton(button, '✅ Copied');
    } catch (e) {
      setStatus('Could not copy — copy manually from the result panel.', false);
    }
  }

  // Copies a single tree value (scalar or nested subtree) to the clipboard,
  // flashing the row so it's clear exactly what got copied.
  async function copyValueToClipboard(text, el) {
    try {
      await navigator.clipboard.writeText(text);
      el.classList.add('copied-flash');
      setTimeout(() => el.classList.remove('copied-flash'), 450);
      const preview = text.length > 60 ? text.slice(0, 60) + '…' : text;
      setStatus('Copied value: ' + preview, true);
    } catch (e) {
      setStatus('Could not copy value.', false);
    }
  }

  document.getElementById('copyBtn').addEventListener('click', (e) => copyFormattedJSON(e.currentTarget));
  document.getElementById('resultCopyBtn').addEventListener('click', (e) => copyFormattedJSON(e.currentTarget));

  document.getElementById('pasteBtn').addEventListener('click', async (e) => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text.trim()) {
        setStatus('Clipboard is empty.', false);
        return;
      }
      input.value = text;
      updateInputCount();
      formatJSON();
      flashButton(e.currentTarget, '✅ Pasted');
    } catch (err) {
      setStatus('Could not read clipboard — paste manually with Cmd/Ctrl+V.', false);
    }
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (!lastFormatted) {
      setStatus('Nothing to download yet — format some JSON first.', false);
      return;
    }
    const blob = new Blob([lastFormatted], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'formatted.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // Shows a status message with an inline "Undo" action, for operations
  // (like Clear) that are easy to trigger by accident.
  function setUndoableStatus(msg, restore) {
    status.innerHTML = '';
    status.className = 'ok';
    status.classList.remove('status-pulse');
    void status.offsetWidth;
    status.classList.add('status-pulse');
    const label = document.createElement('span');
    label.textContent = '✓ ' + msg;
    status.appendChild(label);
    const undoBtn = document.createElement('button');
    undoBtn.className = 'btn-sm status-undo';
    undoBtn.textContent = '↩ Undo';
    undoBtn.addEventListener('click', restore);
    status.appendChild(undoBtn);
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    const snapshot = { value: input.value, formatted: lastFormatted, parsed: lastParsed };
    const hadContent = snapshot.value.trim().length > 0;

    input.value = '';
    updateInputCount();
    output.className = 'empty';
    output.textContent = 'Formatted or opened JSON will appear here.';
    lastFormatted = '';
    lastParsed = undefined;
    searchInput.value = '';
    currentMatches = [];
    currentMatchIndex = -1;
    updateSearchCount();
    hidePathBar();

    if (hadContent) {
      setUndoableStatus('Cleared.', () => {
        input.value = snapshot.value;
        updateInputCount();
        lastFormatted = snapshot.formatted;
        lastParsed = snapshot.parsed;
        if (lastParsed !== undefined) {
          output.className = '';
          renderOutput();
        }
        setStatus('Restored.', true);
      });
    } else {
      setStatus('Cleared.', true);
    }
  });

  // Keyboard shortcut: Cmd/Ctrl+Enter to format
  input.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      formatJSON();
    }
  });

  // Auto-format as soon as JSON is pasted in — no need to click "Format".
  input.addEventListener('paste', () => {
    setTimeout(() => formatJSON(), 0);
  });

  renderHistory();
  updateInputCount();

  // ---------- Theme toggle ----------
  const themeToggle = document.getElementById('themeToggle');
  const THEME_KEY = 'jsonViewer.theme';

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') || 'light';
  }

  function applyThemeIcon() {
    themeToggle.textContent = currentTheme() === 'dark' ? '☀️' : '🌙';
  }

  themeToggle.addEventListener('click', () => {
    const next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    applyThemeIcon();
  });

  applyThemeIcon();
})();
</script>

<script>
(function () {
  'use strict';

  // ================= Compare feature =================
  const MISSING = Symbol('missing');
  const MAX_LCS = 2000;
  const MAX_FILE_SIZE = 50 * 1024 * 1024;
  const WARN_FILE_SIZE = 5 * 1024 * 1024;

  const sides = {};
  let lastCompare = null;
  let currentRows = [];
  let collapsedSet = new Set();
  let searchMatches = [];
  let searchIndex = -1;
  let diffNavIndex = -1;
  let filterMode = 'all';
  let autoCompareTimer = null;
  let scrollSyncing = false;

  // ---------- small helpers ----------
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }
  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }
  function downloadBlob(content, type, filename) {
    const blob = new Blob([content], { type: type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function safeStringify(v) { return typeof v === 'string' ? v : JSON.stringify(v); }
  function flashCompareButton(btn, label) {
    if (!btn) return;
    const original = btn.innerHTML;
    btn.textContent = label;
    btn.disabled = true;
    setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1200);
  }

  // ================= View / tab switching =================
  function switchToCompareView() {
    document.getElementById('formatterView').hidden = true;
    document.getElementById('compareView').hidden = false;
  }
  function switchToFormatterView() {
    document.getElementById('compareView').hidden = true;
    document.getElementById('formatterView').hidden = false;
  }
  function switchCompareTab(tab) {
    const isInput = tab === 'input';
    document.getElementById('compareInputTab').hidden = !isInput;
    document.getElementById('compareResultTab').hidden = isInput;
    document.getElementById('compareTabInputBtn').classList.toggle('active', isInput);
    document.getElementById('compareTabResultBtn').classList.toggle('active', !isInput);
  }
  document.getElementById('compareModeBtn').addEventListener('click', switchToCompareView);
  document.getElementById('compareBackBtn').addEventListener('click', switchToFormatterView);
  document.getElementById('compareTabInputBtn').addEventListener('click', () => switchCompareTab('input'));
  document.getElementById('compareTabResultBtn').addEventListener('click', () => switchCompareTab('result'));

  // ================= Warning banner =================
  function showWarning(msg) {
    const w = document.getElementById('compareWarning');
    w.textContent = '⚠️ ' + msg;
    w.hidden = false;
  }
  function hideWarning() {
    document.getElementById('compareWarning').hidden = true;
  }

  // ================= Per-side input handling =================
  function updateSideCount(side) {
    const text = sides[side].textarea.value;
    sides[side].countEl.textContent = text ? (text.length.toLocaleString() + ' chars') : '';
  }

  function setSideStatus(side, msg, kind) {
    const el = sides[side].statusEl;
    el.textContent = msg;
    el.className = 'compare-side-status' + (kind ? ' ' + kind : '');
  }

  function locateJSONError(text, err) {
    const m = /position (\d+)/.exec(err.message);
    if (!m) return null;
    const pos = parseInt(m[1], 10);
    let line = 1, col = 1;
    for (let i = 0; i < pos && i < text.length; i++) {
      if (text[i] === '\n') { line++; col = 1; } else col++;
    }
    return { line, col };
  }

  function validateSide(side) {
    const raw = sides[side].textarea.value;
    if (!raw.trim()) {
      setSideStatus(side, '✕ Empty JSON input.', 'err');
      return { ok: false, raw, error: { message: 'Empty JSON input' } };
    }
    try {
      const value = JSON.parse(raw);
      setSideStatus(side, '✓ Valid JSON · ' + formatBytes(new Blob([raw]).size), 'ok');
      return { ok: true, raw, value };
    } catch (e) {
      const loc = locateJSONError(raw, e);
      const msg = 'Invalid JSON syntax: ' + e.message + (loc ? ' (line ' + loc.line + ', col ' + loc.col + ')' : '');
      setSideStatus(side, '✕ ' + msg, 'err');
      return { ok: false, raw, error: { message: msg } };
    }
  }

  function handleSideFile(side, file) {
    if (!file) return;
    if (!/\.(json|txt)$/i.test(file.name)) {
      showWarning('Unsupported file extension for "' + file.name + '" — attempting to read it as plain text anyway.');
    }
    if (file.size > MAX_FILE_SIZE) {
      setSideStatus(side, '✕ File too large (' + formatBytes(file.size) + ') — files over 50 MB are not supported.', 'err');
      return;
    }
    if (file.size > WARN_FILE_SIZE) {
      showWarning('Large file loaded for JSON ' + side + ' (' + formatBytes(file.size) + ') — comparison may take a few seconds.');
    }
    const reader = new FileReader();
    reader.onload = () => {
      sides[side].textarea.value = reader.result;
      updateSideCount(side);
      validateSide(side);
    };
    reader.onerror = () => setSideStatus(side, '✕ File read error: could not read "' + file.name + '".', 'err');
    reader.readAsText(file);
  }

  function scheduleAutoCompare() {
    if (!document.getElementById('compareAutoRun').checked) return;
    clearTimeout(autoCompareTimer);
    autoCompareTimer = setTimeout(() => {
      if (sides.A.textarea.value.trim() && sides.B.textarea.value.trim()) runCompare(false);
    }, 700);
  }

  function wireSide(side) {
    const root = document.querySelector('.compare-side[data-side="' + side + '"]');
    const textarea = root.querySelector('.compare-textarea');
    const fileInput = root.querySelector('.compare-file-input');
    sides[side] = {
      root, textarea, fileInput,
      statusEl: document.getElementById('compareStatus' + side),
      countEl: document.getElementById('compareCount' + side)
    };

    textarea.addEventListener('input', () => { updateSideCount(side); scheduleAutoCompare(); });

    root.querySelector('[data-action="paste"]').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        if (!text.trim()) { setSideStatus(side, '✕ Clipboard is empty.', 'err'); return; }
        textarea.value = text;
        updateSideCount(side);
        validateSide(side);
        scheduleAutoCompare();
      } catch (e) {
        setSideStatus(side, '✕ Could not read clipboard — paste manually with Cmd/Ctrl+V.', 'err');
      }
    });

    root.querySelector('[data-action="format"]').addEventListener('click', () => {
      const r = validateSide(side);
      if (r.ok) {
        textarea.value = JSON.stringify(r.value, null, 2);
        updateSideCount(side);
        setSideStatus(side, '✓ Formatted.', 'ok');
      }
    });

    root.querySelector('[data-action="validate"]').addEventListener('click', () => validateSide(side));

    fileInput.addEventListener('change', (e) => {
      handleSideFile(side, e.target.files[0]);
      e.target.value = '';
    });

    let dragDepth = 0;
    root.addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; root.classList.add('drag-over'); });
    root.addEventListener('dragover', (e) => e.preventDefault());
    root.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) root.classList.remove('drag-over');
    });
    root.addEventListener('drop', (e) => {
      e.preventDefault();
      dragDepth = 0;
      root.classList.remove('drag-over');
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) handleSideFile(side, file);
    });

    updateSideCount(side);
  }

  // ================= Diff engine =================
  function typeOf(v) {
    if (v === MISSING) return 'missing';
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  function readOptions() {
    return {
      ignoreKeys: new Set(document.getElementById('compareIgnoreKeys').value.split(',').map((s) => s.trim()).filter(Boolean)),
      strictArrayOrder: document.getElementById('compareStrictArrayOrder').checked,
      caseInsensitive: document.getElementById('compareCaseInsensitive').checked,
      numTolerance: Math.abs(parseFloat(document.getElementById('compareNumTolerance').value)) || 0
    };
  }

  function isIgnoredKey(key, opts) { return key != null && opts.ignoreKeys.has(String(key)); }

  function sameScalar(a, b, type, opts) {
    if (type === 'number') return Math.abs(a - b) <= opts.numTolerance;
    if (type === 'string') return opts.caseInsensitive ? a.toLowerCase() === b.toLowerCase() : a === b;
    return a === b;
  }
  function sameScalarOrNull(a, b, type, opts) {
    if (type === 'null') return true;
    return sameScalar(a, b, type, opts);
  }

  // Structural equality respecting the same options, used to anchor array LCS matching.
  function sameValue(a, b, opts) {
    const ta = typeOf(a), tb = typeOf(b);
    if (ta !== tb) return false;
    if (ta === 'null') return true;
    if (ta === 'object') {
      const ka = Object.keys(a), kb = Object.keys(b);
      if (ka.length !== kb.length) return false;
      for (const k of ka) {
        if (!Object.prototype.hasOwnProperty.call(b, k)) return false;
        if (!sameValue(a[k], b[k], opts)) return false;
      }
      return true;
    }
    if (ta === 'array') {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (!sameValue(a[i], b[i], opts)) return false;
      return true;
    }
    return sameScalar(a, b, ta, opts);
  }

  function indexPairs(a, b) {
    const len = Math.max(a.length, b.length);
    const pairs = [];
    for (let i = 0; i < len; i++) pairs.push({ ai: i < a.length ? i : -1, bi: i < b.length ? i : -1 });
    return pairs;
  }

  // Classic LCS-based diff: anchors are exactly-equal elements (order preserved);
  // gaps between anchors are paired 1:1 as "modified" candidates, with any length
  // surplus falling back to pure removed/added.
  function lcsMatch(a, b, opts) {
    const n = a.length, m = b.length;
    const dp = new Array(n + 1);
    for (let i = 0; i <= n; i++) dp[i] = new Uint32Array(m + 1);
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = sameValue(a[i], b[j], opts) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const anchors = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (sameValue(a[i], b[j], opts)) { anchors.push([i, j]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    const pairs = [];
    let ai = 0, bi = 0;
    const flushGap = (aEnd, bEnd) => {
      const gapLen = Math.min(aEnd - ai, bEnd - bi);
      for (let k = 0; k < gapLen; k++) pairs.push({ ai: ai + k, bi: bi + k });
      for (let k = gapLen; ai + k < aEnd; k++) pairs.push({ ai: ai + k, bi: -1 });
      for (let k = gapLen; bi + k < bEnd; k++) pairs.push({ ai: -1, bi: bi + k });
      ai = aEnd; bi = bEnd;
    };
    anchors.forEach(([ax, bx]) => {
      flushGap(ax, bx);
      pairs.push({ ai: ax, bi: bx });
      ai = ax + 1; bi = bx + 1;
    });
    flushGap(n, m);
    return pairs;
  }

  function matchArrayIndices(a, b, opts) {
    if (opts.strictArrayOrder) return indexPairs(a, b);
    if (a.length > MAX_LCS || b.length > MAX_LCS) return indexPairs(a, b);
    return lcsMatch(a, b, opts);
  }

  function finalizeContainerStatus(node) {
    const statuses = new Set();
    let hasDiff = node.status === 'added' || node.status === 'removed';
    node.children.forEach((c) => {
      const child = c.node;
      const childStatuses = child.isContainer ? child.subtreeStatuses : new Set([child.status]);
      childStatuses.forEach((s) => statuses.add(s));
      if (child.status !== 'same' && child.status !== 'ignored') hasDiff = true;
    });
    if (node.status === 'added' || node.status === 'removed') statuses.add(node.status);
    node.hasDiff = hasDiff;
    node.subtreeStatuses = statuses;
    if (node.status === 'haschanges') node.status = hasDiff ? 'haschanges' : 'same';
  }

  function diffObject(aObj, bObj, aMissing, bMissing, path, key, ctx, opts) {
    ctx.stats.totalKeys++;
    const aKeys = aObj ? Object.keys(aObj) : [];
    const bKeys = bObj ? Object.keys(bObj) : [];
    const seen = new Set();
    const orderedKeys = [];
    aKeys.forEach((k) => { if (!seen.has(k)) { seen.add(k); orderedKeys.push(k); } });
    bKeys.forEach((k) => { if (!seen.has(k)) { seen.add(k); orderedKeys.push(k); } });

    const children = orderedKeys.map((k) => {
      const av = aObj && Object.prototype.hasOwnProperty.call(aObj, k) ? aObj[k] : MISSING;
      const bv = bObj && Object.prototype.hasOwnProperty.call(bObj, k) ? bObj[k] : MISSING;
      return { key: k, node: diffAny(av, bv, path + '.' + k, k, ctx, opts) };
    });

    const node = {
      path, key, isContainer: true, containerType: 'object', aMissing, bMissing, children,
      status: aMissing ? 'added' : (bMissing ? 'removed' : 'haschanges')
    };
    finalizeContainerStatus(node);
    return node;
  }

  function diffArray(aArr, bArr, aMissing, bMissing, path, key, ctx, opts) {
    ctx.stats.totalKeys++;
    const a = aArr || [];
    const b = bArr || [];
    const pairs = matchArrayIndices(a, b, opts);
    const children = pairs.map((p, idx) => {
      const av = p.ai === -1 ? MISSING : a[p.ai];
      const bv = p.bi === -1 ? MISSING : b[p.bi];
      const childNode = diffAny(av, bv, path + '[' + idx + ']', idx, ctx, opts);
      if (childNode.status !== 'same' && childNode.status !== 'ignored') ctx.stats.arrayDiffs++;
      return { key: idx, node: childNode };
    });

    const node = {
      path, key, isContainer: true, containerType: 'array', aMissing, bMissing, children,
      status: aMissing ? 'added' : (bMissing ? 'removed' : 'haschanges')
    };
    finalizeContainerStatus(node);
    return node;
  }

  function diffAny(aVal, bVal, path, key, ctx, opts) {
    const aMissing = aVal === MISSING, bMissing = bVal === MISSING;
    if (key !== null && isIgnoredKey(key, opts)) {
      return {
        path, key, status: 'ignored', aVal, bVal, aMissing, bMissing, isContainer: false,
        aType: aMissing ? null : typeOf(aVal), bType: bMissing ? null : typeOf(bVal)
      };
    }
    const aType = aMissing ? null : typeOf(aVal);
    const bType = bMissing ? null : typeOf(bVal);
    const isObjA = aType === 'object', isObjB = bType === 'object';
    const isArrA = aType === 'array', isArrB = bType === 'array';
    const bothObject = (aMissing || isObjA) && (bMissing || isObjB) && (isObjA || isObjB);
    const bothArray = (aMissing || isArrA) && (bMissing || isArrB) && (isArrA || isArrB);

    if (bothObject) return diffObject(aMissing ? null : aVal, bMissing ? null : bVal, aMissing, bMissing, path, key, ctx, opts);
    if (bothArray) return diffArray(aMissing ? null : aVal, bMissing ? null : bVal, aMissing, bMissing, path, key, ctx, opts);

    ctx.stats.totalKeys++;
    let status;
    if (aMissing !== bMissing) {
      status = aMissing ? 'added' : 'removed';
      if (status === 'added') ctx.stats.added++; else ctx.stats.missing++;
    } else if (aType !== bType) {
      status = 'typechange';
      ctx.stats.typeChanges++;
    } else if (!sameScalarOrNull(aVal, bVal, aType, opts)) {
      status = 'modified';
      ctx.stats.modified++;
    } else {
      status = 'same';
    }
    return { path, key, status, aVal, bVal, aMissing, bMissing, aType, bType, isContainer: false };
  }

  // ================= Flatten diff tree into aligned rows =================
  function keyPrefixHtml(node) {
    if (typeof node.key === 'string') {
      return '<span class="diff-key">' + escapeHtml(JSON.stringify(node.key)) + '</span><span class="diff-punct">: </span>';
    }
    return '';
  }
  function valueHtml(val, type) {
    switch (type) {
      case 'string': return '<span class="diff-str">' + escapeHtml(JSON.stringify(val)) + '</span>';
      case 'number': return '<span class="diff-num">' + String(val) + '</span>';
      case 'boolean': return '<span class="diff-bool">' + String(val) + '</span>';
      case 'null': return '<span class="diff-null">null</span>';
      default: return '<span class="diff-str">' + escapeHtml(String(val)) + '</span>';
    }
  }
  function rowStatusForContainerLine(node) {
    return (node.status === 'added' || node.status === 'removed') ? node.status : 'same';
  }

  function makeLeafRow(node, depth, ancestors, isLastSibling) {
    const prefix = keyPrefixHtml(node);
    const commaHtml = isLastSibling ? '' : '<span class="diff-punct">,</span>';
    const typeNote = node.status === 'typechange'
      ? ' <span class="diff-typenote">(' + node.aType + ' → ' + node.bType + ')</span>' : '';
    const a = node.aMissing ? { present: false } : { present: true, html: prefix + valueHtml(node.aVal, node.aType) + typeNote + commaHtml };
    const b = node.bMissing ? { present: false } : { present: true, html: prefix + valueHtml(node.bVal, node.bType) + typeNote + commaHtml };
    const keyText = typeof node.key === 'string' ? node.key.toLowerCase() : '';
    const valText = (node.aMissing ? '' : String(node.aVal)) + ' ' + (node.bMissing ? '' : String(node.bVal));
    return {
      path: node.path, depth, ancestors, isOpen: false, status: node.status, a, b,
      filterStatuses: new Set([node.status]), hasDiff: node.status !== 'same' && node.status !== 'ignored',
      searchText: (keyText + ' ' + valText).toLowerCase()
    };
  }

  function makeEmptyContainerRow(node, depth, ancestors, isLastSibling) {
    const prefix = keyPrefixHtml(node);
    const brackets = node.containerType === 'array' ? '[]' : '{}';
    const commaHtml = isLastSibling ? '' : '<span class="diff-punct">,</span>';
    const status = rowStatusForContainerLine(node);
    function sideHtml(missing) {
      if (missing) return { present: false };
      return { present: true, html: prefix + '<span class="diff-punct">' + brackets + '</span>' + commaHtml };
    }
    const keyText = typeof node.key === 'string' ? node.key.toLowerCase() : '';
    return {
      path: node.path, depth, ancestors, isOpen: false, status,
      a: sideHtml(node.aMissing), b: sideHtml(node.bMissing),
      filterStatuses: new Set([status]), hasDiff: node.hasDiff, searchText: keyText
    };
  }

  function makeContainerOpenRow(node, depth, ancestors) {
    const prefix = keyPrefixHtml(node);
    const bracket = node.containerType === 'array' ? '[' : '{';
    const toggleHtml = '<span class="diff-toggle" data-toggle-path="' + escapeAttr(node.path) + '">▾</span>';
    const status = rowStatusForContainerLine(node);
    function sideHtml(missing) {
      if (missing) return { present: false };
      return { present: true, html: prefix + toggleHtml + '<span class="diff-punct">' + bracket + '</span>' };
    }
    const keyText = typeof node.key === 'string' ? node.key.toLowerCase() : '';
    return {
      path: node.path, depth, ancestors, isOpen: true, status,
      a: sideHtml(node.aMissing), b: sideHtml(node.bMissing),
      filterStatuses: node.subtreeStatuses, hasDiff: node.hasDiff, searchText: keyText
    };
  }

  function makeContainerCloseRow(node, depth, ancestors, isLastSibling) {
    const bracket = node.containerType === 'array' ? ']' : '}';
    const commaHtml = isLastSibling ? '' : '<span class="diff-punct">,</span>';
    const status = rowStatusForContainerLine(node);
    function sideHtml(missing) {
      if (missing) return { present: false };
      return { present: true, html: '<span class="diff-punct">' + bracket + '</span>' + commaHtml };
    }
    return {
      path: node.path + '␀close', depth, ancestors, isOpen: false, status,
      a: sideHtml(node.aMissing), b: sideHtml(node.bMissing),
      filterStatuses: node.subtreeStatuses, hasDiff: node.hasDiff, searchText: ''
    };
  }

  function flattenNode(node, depth, rows, ancestors, isLastSibling) {
    if (node.isContainer) {
      if (node.children.length === 0) {
        rows.push(makeEmptyContainerRow(node, depth, ancestors, isLastSibling));
        return;
      }
      rows.push(makeContainerOpenRow(node, depth, ancestors));
      const childAncestors = ancestors.concat([node.path]);
      node.children.forEach((c, i) => flattenNode(c.node, depth + 1, rows, childAncestors, i === node.children.length - 1));
      rows.push(makeContainerCloseRow(node, depth, ancestors, isLastSibling));
    } else {
      rows.push(makeLeafRow(node, depth, ancestors, isLastSibling));
    }
  }

  function flattenTree(root) {
    const rows = [];
    flattenNode(root, 0, rows, [], true);
    rows.forEach((r, i) => { r.id = i; });
    return rows;
  }

  // ================= Rendering =================
  function buildLineEl(sideData, lineNo, row) {
    const line = document.createElement('div');
    line.className = 'diff-line';
    const ln = document.createElement('span');
    ln.className = 'diff-ln';
    ln.textContent = String(lineNo);
    const content = document.createElement('span');
    content.className = 'diff-content';
    content.style.paddingLeft = (10 + row.depth * 16) + 'px';
    if (!sideData.present) {
      content.classList.add('diff-gapside');
    } else {
      content.innerHTML = sideData.html;
      if (row.status === 'added') content.classList.add('diff-added');
      else if (row.status === 'removed') content.classList.add('diff-removed');
      else if (row.status === 'modified' || row.status === 'typechange') content.classList.add('diff-modified');
    }
    line.appendChild(ln);
    line.appendChild(content);
    return line;
  }

  function renderRows(rows) {
    const paneA = document.getElementById('comparePaneA');
    const paneB = document.getElementById('comparePaneB');
    paneA.innerHTML = '';
    paneB.innerHTML = '';
    const fragA = document.createDocumentFragment();
    const fragB = document.createDocumentFragment();
    rows.forEach((row, i) => {
      const lineNo = i + 1;
      row.elA = buildLineEl(row.a, lineNo, row);
      row.elB = buildLineEl(row.b, lineNo, row);
      fragA.appendChild(row.elA);
      fragB.appendChild(row.elB);
    });
    paneA.appendChild(fragA);
    paneB.appendChild(fragB);
  }

  function rowHiddenByCollapse(row) { return row.ancestors.some((p) => collapsedSet.has(p)); }
  function rowHiddenByFilter(row) {
    if (filterMode === 'all') return false;
    if (filterMode === 'diff') return !row.hasDiff;
    if (filterMode === 'modified') return !(row.filterStatuses.has('modified') || row.filterStatuses.has('typechange'));
    return !row.filterStatuses.has(filterMode);
  }
  function applyVisibility() {
    currentRows.forEach((row) => {
      const hidden = rowHiddenByCollapse(row) || rowHiddenByFilter(row);
      if (row.elA) row.elA.classList.toggle('diff-hidden', hidden);
      if (row.elB) row.elB.classList.toggle('diff-hidden', hidden);
    });
  }
  function refreshAllToggleGlyphs() {
    document.querySelectorAll('#comparePaneA .diff-toggle, #comparePaneB .diff-toggle').forEach((el) => {
      el.textContent = collapsedSet.has(el.dataset.togglePath) ? '▸' : '▾';
    });
  }
  function toggleCollapse(path) {
    if (collapsedSet.has(path)) collapsedSet.delete(path); else collapsedSet.add(path);
    refreshAllToggleGlyphs();
    applyVisibility();
  }
  function handlePaneClick(e) {
    const toggle = e.target.closest('.diff-toggle');
    if (toggle) toggleCollapse(toggle.dataset.togglePath);
  }
  document.getElementById('comparePaneA').addEventListener('click', handlePaneClick);
  document.getElementById('comparePaneB').addEventListener('click', handlePaneClick);

  document.getElementById('compareExpandAllBtn').addEventListener('click', () => {
    collapsedSet.clear();
    refreshAllToggleGlyphs();
    applyVisibility();
  });
  document.getElementById('compareCollapseAllBtn').addEventListener('click', () => {
    currentRows.forEach((r) => { if (r.isOpen) collapsedSet.add(r.path); });
    refreshAllToggleGlyphs();
    applyVisibility();
  });
  document.getElementById('compareFilterSelect').addEventListener('change', (e) => {
    filterMode = e.target.value;
    applyVisibility();
  });

  // ---------- synchronized scrolling ----------
  function wireScrollSync() {
    const a = document.getElementById('comparePaneA');
    const b = document.getElementById('comparePaneB');
    function mirror(from, to) {
      return () => {
        if (scrollSyncing) return;
        scrollSyncing = true;
        to.scrollTop = from.scrollTop;
        to.scrollLeft = from.scrollLeft;
        scrollSyncing = false;
      };
    }
    a.addEventListener('scroll', mirror(a, b));
    b.addEventListener('scroll', mirror(b, a));
  }

  // ================= Summary =================
  function renderSummary(stats) {
    const el = document.getElementById('compareSummary');
    const hasDiffs = (stats.modified + stats.missing + stats.added + stats.typeChanges) > 0;
    const pills = [
      ['Total Keys Compared', stats.totalKeys, ''],
      ['Modified Values', stats.modified, 'sp-modified'],
      ['Missing Keys', stats.missing, 'sp-missing'],
      ['Added Keys', stats.added, 'sp-added'],
      ['Type Changes', stats.typeChanges, 'sp-modified'],
      ['Array Differences', stats.arrayDiffs, 'sp-modified']
    ];
    el.innerHTML = pills.map((p) =>
      '<div class="summary-pill ' + p[2] + '"><span class="sp-value">' + p[1].toLocaleString() + '</span><span class="sp-label">' + p[0] + '</span></div>'
    ).join('') +
      '<div class="summary-pill ' + (hasDiffs ? 'sp-status-diff' : 'sp-status-same') + '">' +
      '<span class="sp-value">' + (hasDiffs ? '⚠️' : '✅') + '</span>' +
      '<span class="sp-label">' + (hasDiffs ? 'Differences Found' : 'Identical') + '</span></div>';
  }

  // ================= Search =================
  function clearCompareSearchHighlights() {
    document.querySelectorAll('#comparePaneA .search-match, #comparePaneB .search-match').forEach((el) => el.classList.remove('search-match'));
  }
  function updateCompareSearchCount() {
    const countEl = document.getElementById('compareSearchCount');
    const q = document.getElementById('compareSearchInput').value.trim();
    countEl.textContent = !searchMatches.length ? (q ? '0 / 0' : '') : (searchIndex + 1) + ' / ' + searchMatches.length;
  }
  function focusCompareMatch() {
    document.querySelectorAll('#comparePaneA .diff-current-match, #comparePaneB .diff-current-match').forEach((el) => el.classList.remove('diff-current-match'));
    const m = searchMatches[searchIndex];
    if (!m) return;
    if (m.row.elA) m.row.elA.classList.add('diff-current-match');
    if (m.row.elB) m.row.elB.classList.add('diff-current-match');
    const target = m.row.elA || m.row.elB;
    if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  function performCompareSearch(query) {
    clearCompareSearchHighlights();
    const q = query.trim().toLowerCase();
    searchMatches = [];
    searchIndex = -1;
    if (!q) { updateCompareSearchCount(); return; }
    currentRows.forEach((row) => {
      if (row.searchText && row.searchText.includes(q)) searchMatches.push({ row });
    });
    searchMatches.forEach((m) => {
      m.row.ancestors.forEach((p) => collapsedSet.delete(p));
      const ca = m.row.elA && m.row.elA.querySelector('.diff-content');
      const cb = m.row.elB && m.row.elB.querySelector('.diff-content');
      if (ca && !ca.classList.contains('diff-gapside')) ca.classList.add('search-match');
      if (cb && !cb.classList.contains('diff-gapside')) cb.classList.add('search-match');
    });
    refreshAllToggleGlyphs();
    applyVisibility();
    if (searchMatches.length) { searchIndex = 0; focusCompareMatch(); }
    updateCompareSearchCount();
  }
  function goToCompareMatch(delta) {
    if (!searchMatches.length) return;
    searchIndex = (searchIndex + delta + searchMatches.length) % searchMatches.length;
    focusCompareMatch();
    updateCompareSearchCount();
  }
  const compareSearchInput = document.getElementById('compareSearchInput');
  compareSearchInput.addEventListener('input', () => performCompareSearch(compareSearchInput.value));
  compareSearchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); goToCompareMatch(e.shiftKey ? -1 : 1); }
  });
  document.getElementById('comparePrevMatchBtn').addEventListener('click', () => goToCompareMatch(-1));
  document.getElementById('compareNextMatchBtn').addEventListener('click', () => goToCompareMatch(1));

  // ================= Difference navigation =================
  function currentDiffRows() {
    return currentRows.filter((r) => !r.isOpen && (r.status === 'added' || r.status === 'removed' || r.status === 'modified' || r.status === 'typechange'));
  }
  function navigateDiff(delta) {
    const rows = currentDiffRows();
    if (!rows.length) return;
    diffNavIndex = (diffNavIndex + delta + rows.length) % rows.length;
    const row = rows[diffNavIndex];
    row.ancestors.forEach((p) => collapsedSet.delete(p));
    refreshAllToggleGlyphs();
    applyVisibility();
    document.querySelectorAll('#comparePaneA .diff-current-match, #comparePaneB .diff-current-match').forEach((el) => el.classList.remove('diff-current-match'));
    if (row.elA) row.elA.classList.add('diff-current-match');
    if (row.elB) row.elB.classList.add('diff-current-match');
    const target = row.elA || row.elB;
    if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  document.getElementById('comparePrevDiffBtn').addEventListener('click', () => navigateDiff(-1));
  document.getElementById('compareNextDiffBtn').addEventListener('click', () => navigateDiff(1));

  // ================= Report / export =================
  function collectDiffs(node, out) {
    if (node.isContainer) {
      if (node.children.length === 0) { if (node.status !== 'same') out.push(node); return; }
      if (node.status === 'added' || node.status === 'removed') { out.push(node); return; }
      node.children.forEach((c) => collectDiffs(c.node, out));
    } else if (node.status !== 'same' && node.status !== 'ignored') {
      out.push(node);
    }
  }
  function buildDiffEntries() {
    if (!lastCompare) return [];
    const out = [];
    collectDiffs(lastCompare.root, out);
    return out.map((n) => ({
      path: n.path, status: n.status,
      left: n.aMissing ? undefined : n.aVal,
      right: n.bMissing ? undefined : n.bVal
    }));
  }
  function buildDiffReportTextFromEntries(entries) {
    const s = lastCompare.ctx.stats;
    const lines = [
      'JSON Comparison Report', '=======================', '',
      'Total Keys Compared : ' + s.totalKeys,
      'Modified Values     : ' + s.modified,
      'Missing Keys        : ' + s.missing,
      'Added Keys          : ' + s.added,
      'Type Changes        : ' + s.typeChanges,
      'Array Differences   : ' + s.arrayDiffs,
      'Status              : ' + (entries.length ? 'Differences Found' : 'Identical'), ''
    ];
    entries.forEach((e) => {
      lines.push('[' + e.status.toUpperCase() + '] ' + e.path);
      if (e.left !== undefined) lines.push('   A: ' + safeStringify(e.left));
      if (e.right !== undefined) lines.push('   B: ' + safeStringify(e.right));
    });
    if (!entries.length) lines.push('No differences found — both JSON structures are equivalent.');
    return lines.join('\n');
  }
  function buildHtmlReport() {
    const entries = buildDiffEntries();
    const s = lastCompare.ctx.stats;
    const rowsHtml = entries.map((e) =>
      '<tr class="row-' + e.status + '"><td>' + e.status.toUpperCase() + '</td><td>' + escapeHtml(e.path) + '</td>' +
      '<td>' + (e.left !== undefined ? escapeHtml(safeStringify(e.left)) : '<em>—</em>') + '</td>' +
      '<td>' + (e.right !== undefined ? escapeHtml(safeStringify(e.right)) : '<em>—</em>') + '</td></tr>'
    ).join('');
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>JSON Comparison Report</title><style>' +
      'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:24px;color:#1e1e1e}' +
      'h1{font-size:18px}table{border-collapse:collapse;width:100%;margin-top:14px;font-size:13px}' +
      'th,td{border:1px solid #ddd;padding:6px 10px;text-align:left;vertical-align:top;word-break:break-word}' +
      'th{background:#f4f4f5}.row-added{background:#eafaf0}.row-removed{background:#fdecec}' +
      '.row-modified,.row-typechange{background:#fff4e0}.summary span{display:inline-block;margin-right:18px;font-size:13px}' +
      '</style></head><body>' +
      '<h1>JSON Comparison Report</h1>' +
      '<div class="summary">' +
      '<span><b>Total Keys Compared:</b> ' + s.totalKeys + '</span>' +
      '<span><b>Modified:</b> ' + s.modified + '</span>' +
      '<span><b>Missing:</b> ' + s.missing + '</span>' +
      '<span><b>Added:</b> ' + s.added + '</span>' +
      '<span><b>Type Changes:</b> ' + s.typeChanges + '</span>' +
      '<span><b>Array Diffs:</b> ' + s.arrayDiffs + '</span>' +
      '<span><b>Status:</b> ' + (entries.length ? 'Differences Found' : 'Identical') + '</span>' +
      '</div>' +
      '<table><thead><tr><th>Type</th><th>Path</th><th>JSON A</th><th>JSON B</th></tr></thead><tbody>' +
      (rowsHtml || '<tr><td colspan="4">No differences found.</td></tr>') + '</tbody></table>' +
      '</body></html>';
  }
  function exportJson() {
    if (!lastCompare) return;
    const entries = buildDiffEntries();
    const payload = { summary: lastCompare.ctx.stats, status: entries.length ? 'Differences Found' : 'Identical', differences: entries };
    downloadBlob(JSON.stringify(payload, null, 2), 'application/json', 'json-comparison-result.json');
  }
  function exportHtml() {
    if (!lastCompare) return;
    downloadBlob(buildHtmlReport(), 'text/html', 'json-comparison-report.html');
  }
  function exportPdf() {
    if (!lastCompare) return;
    const win = window.open('', '_blank');
    if (!win) { alert('Please allow pop-ups to export as PDF.'); return; }
    win.document.write(buildHtmlReport());
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }

  async function copySideJson(side) {
    if (!lastCompare) return;
    const value = side === 'A' ? lastCompare.valueA : lastCompare.valueB;
    try {
      await navigator.clipboard.writeText(JSON.stringify(value, null, 2));
      flashCompareButton(document.getElementById(side === 'A' ? 'compareCopyLeftBtn' : 'compareCopyRightBtn'), '✅ Copied');
    } catch (e) { /* clipboard unavailable */ }
  }
  document.getElementById('compareCopyLeftBtn').addEventListener('click', () => copySideJson('A'));
  document.getElementById('compareCopyRightBtn').addEventListener('click', () => copySideJson('B'));
  document.getElementById('compareCopyReportBtn').addEventListener('click', async () => {
    if (!lastCompare) return;
    try {
      await navigator.clipboard.writeText(buildDiffReportTextFromEntries(buildDiffEntries()));
      flashCompareButton(document.getElementById('compareCopyReportBtn'), '✅ Copied');
    } catch (e) { /* clipboard unavailable */ }
  });
  document.getElementById('compareExportJsonBtn').addEventListener('click', exportJson);
  document.getElementById('compareExportTxtBtn').addEventListener('click', () => {
    if (!lastCompare) return;
    downloadBlob(buildDiffReportTextFromEntries(buildDiffEntries()), 'text/plain', 'json-comparison-report.txt');
  });
  document.getElementById('compareExportHtmlBtn').addEventListener('click', exportHtml);
  document.getElementById('compareExportPdfBtn').addEventListener('click', exportPdf);
  document.getElementById('compareDownloadBtn').addEventListener('click', exportJson);

  // ================= Run compare =================
  function showResultLoading() {
    document.getElementById('compareLoading').hidden = false;
    document.getElementById('compareResultBody').hidden = true;
    document.getElementById('compareEmptyResult').hidden = true;
  }
  function showResultError(msg) {
    document.getElementById('compareLoading').hidden = true;
    document.getElementById('compareResultBody').hidden = true;
    const empty = document.getElementById('compareEmptyResult');
    empty.hidden = false;
    empty.textContent = msg;
  }
  function buildRowsAndRender(root, ctx) {
    document.getElementById('compareLoading').hidden = true;
    document.getElementById('compareEmptyResult').hidden = true;
    document.getElementById('compareResultBody').hidden = false;
    collapsedSet = new Set();
    filterMode = 'all';
    document.getElementById('compareFilterSelect').value = 'all';
    diffNavIndex = -1;
    currentRows = flattenTree(root);
    renderRows(currentRows);
    applyVisibility();
    renderSummary(ctx.stats);
    searchMatches = [];
    searchIndex = -1;
    const q = document.getElementById('compareSearchInput').value;
    if (q.trim()) performCompareSearch(q); else updateCompareSearchCount();
  }

  function runCompare(switchTab) {
    hideWarning();
    const rA = validateSide('A');
    const rB = validateSide('B');
    if (!rA.ok || !rB.ok) return;
    showResultLoading();
    if (switchTab) switchCompareTab('result');
    setTimeout(() => {
      try {
        const opts = readOptions();
        const ctx = { stats: { totalKeys: 0, modified: 0, missing: 0, added: 0, typeChanges: 0, arrayDiffs: 0 } };
        const root = diffAny(rA.value, rB.value, '$', null, ctx, opts);
        lastCompare = { root, ctx, rawA: rA.raw, rawB: rB.raw, valueA: rA.value, valueB: rB.value };
        buildRowsAndRender(root, ctx);
        document.getElementById('compareDownloadBtn').disabled = false;
      } catch (e) {
        showResultError('Comparison failed: ' + e.message + '. This may be caused by extremely large or deeply nested input.');
      }
    }, 10);
  }
  document.getElementById('runCompareBtn').addEventListener('click', () => runCompare(true));

  // ================= Clear / Swap =================
  document.getElementById('compareClearBtn').addEventListener('click', () => {
    sides.A.textarea.value = '';
    sides.B.textarea.value = '';
    updateSideCount('A');
    updateSideCount('B');
    setSideStatus('A', '', '');
    setSideStatus('B', '', '');
    hideWarning();
    lastCompare = null;
    currentRows = [];
    collapsedSet = new Set();
    searchMatches = [];
    searchIndex = -1;
    document.getElementById('compareDownloadBtn').disabled = true;
    document.getElementById('compareResultBody').hidden = true;
    const empty = document.getElementById('compareEmptyResult');
    empty.hidden = false;
    empty.textContent = 'Run a comparison from the Input tab to see results here.';
    switchCompareTab('input');
  });

  document.getElementById('compareSwapBtn').addEventListener('click', () => {
    const tmp = sides.A.textarea.value;
    sides.A.textarea.value = sides.B.textarea.value;
    sides.B.textarea.value = tmp;
    updateSideCount('A');
    updateSideCount('B');
    setSideStatus('A', '', '');
    setSideStatus('B', '', '');
    document.getElementById('compareDownloadBtn').disabled = true;
    lastCompare = null;
  });

  // ================= Init =================
  wireSide('A');
  wireSide('B');
  wireScrollSync();
})();
</script>

</body>
</html>
